plugins {
    id 'base'
    id 'fabric-loom' version '1.6.12' apply false
    id 'com.google.protobuf' version '0.9.6' apply false
}

ext {
    frameworkDir = file(findProperty('frameworkDir') ?: '../Kizuna-Inventory-UI-Framework')
    kpaDir = file(findProperty('kpaDir') ?: '../Kizuna-Players-Animation')
    bs3dDir = file(findProperty('bs3dDir') ?: '../backpack-and-storage-3D')
    protobufVersion = '4.36.2'
    frameworkJar = new File(frameworkDir, 'build/libs/kizuna-inventory-ui-framework-0.1.0-SNAPSHOT.jar')
    frameworkServerJar = new File(frameworkDir, 'server/build/libs/kizuna-inventory-ui-framework-server-0.1.0-SNAPSHOT.jar')
    kpaJar = new File(kpaDir, 'build/libs/kizuna-players-animation-0.1.0-SNAPSHOT.jar')
    bs3dClientJar = new File(bs3dDir, 'client/build/libs/backpack-storage-3d-client-0.1.0-SNAPSHOT.jar')
    bs3dServerJar = new File(bs3dDir, 'server/build/libs/backpack-storage-3d-server-0.1.0-SNAPSHOT.jar')
}

subprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'com.google.protobuf'

    group = 'dev.kizuna.kpabs3d'
    version = '0.1.0-SNAPSHOT'
    base.archivesName = "kpa-bs3d-swing-addon-${project.name}"

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wispforest.io/releases' }
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }

    dependencies {
        minecraft 'com.mojang:minecraft:1.20.1'
        mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
        modImplementation 'net.fabricmc:fabric-loader:0.16.10'
        modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1'
        implementation "com.google.protobuf:protobuf-java:${rootProject.protobufVersion}"
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    sourceSets.main {
        java.srcDir rootProject.file('shared/src/main/java')
        proto.srcDir rootProject.file('shared/src/main/proto')
        resources.srcDir rootProject.file('shared/src/main/resources')
    }

    protobuf {
        protoc { artifact = "com.google.protobuf:protoc:${rootProject.protobufVersion}" }
        generateProtoTasks {
            ofSourceSet('main').configureEach { task ->
                task.generateDescriptorSet = true
                task.descriptorSetOptions.path = layout.buildDirectory.file('descriptors/container-swing-v1.desc').get().asFile.path
                task.descriptorSetOptions.includeSourceInfo = true
            }
        }
    }

    test { useJUnitPlatform() }

    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand version: project.version }
    }

    jar {
        from rootProject.file('LICENSE')
        from rootProject.file('THIRD_PARTY_NOTICES.md')
    }

    loom {
        mods {
            'kpa_bs3d_swing' { sourceSet sourceSets.main }
        }
    }
}

tasks.register('protocolZip', Zip) {
    dependsOn ':server:generateProto'
    archiveFileName = 'kpa-bs3d-swing-addon-0.1.0-SNAPSHOT-proto.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('shared/src/main/proto')
    from(project(':server').layout.buildDirectory.file('descriptors/container-swing-v1.desc')) { into 'descriptors' }
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}

tasks.named('build') {
    dependsOn ':client:build', ':server:build', 'protocolZip'
}

tasks.named('check') {
    dependsOn ':client:check', ':server:check'
}
